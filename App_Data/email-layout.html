<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>%%%title%%%</title>
	<style>
		@media only screen and (max-width: 640px) {
			.email-shell,
			.email-panel,
			.email-footer {
				width: 100% !important;
			}

			.email-panel-cell,
			.email-footer-cell {
				padding-left: 24px !important;
				padding-right: 24px !important;
			}

			.email-button {
				width: 100% !important;
			}
		}
	</style>
</head>
<body style="margin:0;padding:0;background-color:#f5f7fb;color:#1f2937;font-family:Arial,Helvetica,sans-serif;">
	<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;mso-hide:all;">
		%%%preheader%%%
	</div>

	<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;background-color:#f5f7fb;">
		<tr>
			<td align="center" style="padding:40px 16px;">
				<table role="presentation" class="email-shell" width="640" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;width:640px;">
					<tr>
						<td>
							<table role="presentation" class="email-panel" width="640" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;width:640px;background-color:#ffffff;border:1px solid #e3e8f1;border-radius:8px;">
								<tr>
									<td class="email-panel-cell" style="padding:34px 44px 18px;">
										<a href="%%%url%%%" target="_blank" style="text-decoration:none;">
											<img src="%%%url%%%/images/signfabric.svg" alt="SignFabric" width="178" height="42" style="display:block;border:0;height:auto;max-width:178px;">
										</a>
									</td>
								</tr>
								<tr>
									<td class="email-panel-cell" style="padding:18px 44px 44px;">
										%%%body%%%
									</td>
								</tr>
							</table>

							<table role="presentation" class="email-footer" width="640" cellspacing="0" cellpadding="0" border="0" style="border-collapse:collapse;width:640px;">
								<tr>
									<td class="email-footer-cell" style="padding:24px 44px 0;text-align:center;color:#697386;font-size:12px;line-height:18px;">
										<div style="border-top:1px solid #d9e0ea;margin-bottom:22px;"></div>
										<p style="margin:0 0 10px;">
											<strong style="color:#2f3a4a;">SignFabric</strong> by Text Control
										</p>
										<p style="margin:0;">
											4600 Park Road, Suite 300, Charlotte, NC 28209, USA
										</p>
										<p style="margin:12px 0 0;">
											<a href="https://www.textcontrol.com/service/privacy/" target="_blank" style="color:#4f46e5;text-decoration:none;">Privacy Policy</a>
											&nbsp;&middot;&nbsp;
											<a href="https://www.textcontrol.com/" target="_blank" style="color:#4f46e5;text-decoration:none;">Text Control</a>
										</p>
									</td>
								</tr>
							</table>
						</td>
					</tr>
				</table>
			</td>
		</tr>
	</table>
</body>
</html>
